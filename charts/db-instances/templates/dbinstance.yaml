{{- $selectorLabels := include "db-instances.selectorLabels" . }}
{{- $operatorNs := include "db-instances.operatorNs" . -}}
{{- if .Values.dbinstances }}
{{- range $name, $value := .Values.dbinstances }}
---
apiVersion: "kinda.rocks/v1"
kind: "DbInstance"
metadata:
  name: {{ $name }}
  annotations:
    {{- if $value.google }}
    checksum/config: {{ $value.google.configMap.data | sha256sum }}
    {{- end }}
  labels:
    {{- include "db-instances.labels" $ | nindent 4 }}
    {{- with $value.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $value.instanceVars }}
  instanceVars:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  engine: {{ $value.engine }}
  {{- if $value.existingAdminSecret }}
  auth:
    username:
      valueFrom:
        secret:
          namespace: {{ $value.existingAdminSecret.namespace }}
          name: {{ $value.existingAdminSecret.name }}
          key: user
    password:
      valueFrom:
        secret:
          namespace: {{ $value.existingAdminSecret.namespace }}
          name: {{ $value.existingAdminSecret.name }}
          key: password
  {{- else }}
  auth:
    username:
      valueFrom:
        secret:
          namespace: {{ $operatorNs }}
          name: {{ $name }}-admin-secret
          key: user
    password:
      valueFrom:
        secret:
          namespace: {{ $operatorNs }}
          name: {{ $name }}-admin-secret
          key: password
  {{- end }}
  endpoint:
    host:
      valueFrom:
        configMap:
          name: {{ $name }}-config
          namespace: {{ $operatorNs }}
          key: host
    port:
      valueFrom:
        configMap:
          name: {{ $name }}-config
          namespace: {{ $operatorNs }}
          key: port
  {{- with $value.namespaceFilters }}
  namespaceFilters:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with $value.allowedPriveleges }}
  allowedPriveleges:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
{{- if not $value.existingAdminSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-admin-secret
  namespace: {{ $operatorNs }}
  labels:
    {{ include "db-instances.labels" $ | nindent 4 }}
type: Opaque
data:
  user: {{ $value.secrets.adminUser | b64enc }}
  password: {{ $value.secrets.adminPassword | b64enc }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $operatorNs }}
  labels:
    {{- include "db-instances.labels" $ | nindent 4 }}
data:
{{- if $value.google }}
  config: |
    {{ $value.google.configMap.data | nindent 4 }}
{{- end }}
{{- if $value.generic }}
  host: {{ $value.generic.host }}
  port: {{ $value.generic.port | quote }}
  {{- if $value.generic.publicIp }}
  publicIp: {{ $value.generic.publicIp }}
  {{- end }}
{{- end }}

{{- if $value.google }}
{{- if $value.google.clientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-client-secret
  namespace: {{ $operatorNs }}
  labels:
    {{- include "db-instances.labels" $ | nindent 4 }}
data:
  credentials.json: |-
    {{ $value.google.clientSecret | b64enc | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
