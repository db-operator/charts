dbinstances:
  instance1:
    serviceMonitor:
      enabled: true
    podMonitor:
      enabled: true
    engine: postgres
    monitoring:
      enabled: true
    secrets:
      adminUser: admin
      adminPassword: IamAdmin
    instanceVars:
      TEST: TEST
    generic:
      host: postgres-instance.databases.svc.cluster.local
      port: 5432
  instance2:
    engine: mysql
    monitoring:
      enabled: true
    secrets:
      adminUser: adminUser
      adminPassword: adminAdmin
    generic:
      host: mariadb-instance.databases.svc.cluster.local
      port: 3306
